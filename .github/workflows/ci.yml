name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra fixtures
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra fixtures
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --extra fixtures
      - name: Run tests
        run: uv run pytest -q --cov=tokenmill --cov-report=term-missing

  fixtures:
    name: Fixture corpus is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra fixtures
      # Regenerates the whole corpus into a temp dir and compares SHA-256
      # digests against what is committed. Catches both accidental fixture
      # edits and any non-determinism creeping into the generator.
      - run: uv run python scripts/make_fixtures.py --check

  clean-core-install:
    name: Clean core install (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Deliberately plain pip, no extras, no dev group: this job is the
      # standing guard on the promise that `pip install tokenmill` stays light,
      # CPU-only and free of system-binary requirements. If a heavy dependency
      # ever leaks into the core tier, this is where it surfaces.
      - name: Install only the core tier
        run: python -m pip install .
      - name: Import the package outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -c "import tokenmill, sys; print(tokenmill.__version__, sys.version)"
      - name: Report what the core install actually pulled in
        run: python -m pip list
