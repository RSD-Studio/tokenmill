name: CI

on:
  push:
    # Phase 1 found this workflow had never run once: the filter named `main`,
    # which did not exist, and every phase lived on a `claude/**` branch.
    #
    # Phase 2 found the second half of the same bug. The default branch is now
    # `Main`, with a capital M, and GitHub matches these patterns
    # case-sensitively — so a push to the default branch still would not have
    # triggered anything. Both spellings are listed until the branch is renamed;
    # see PROGRESS.md, Open questions.
    branches: ["main", "Main", "claude/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. Primarily for the `docling` job below, which is gated to this
    # trigger and to manual dispatch. RESEARCH.md's own
    # closing caveat is that this ecosystem moves fast and versions and licences
    # must be re-verified before shipping; docs/BACKENDS.md's premise is that
    # every claim about a backend is asserted by a test. A backend nobody ever
    # exercises is a claim quietly decaying, and docling — 122 packages deep — is
    # the likeliest to drift.
    #
    # The weekly run is deliberately lean: `docling` and `clean-core-install`
    # only. Everything else is gated off this event with
    # `github.event_name != 'schedule'`. Re-running nine OS/Python cells against
    # a frozen lockfile every week would prove nothing that the last push did
    # not already prove, and Actions minutes are not free — macOS bills at 10x
    # and Windows at 2x. `clean-core-install` earns its place because it uses
    # plain `pip install .` with no lockfile, so it is the one job that catches
    # a new release of a core dependency breaking a fresh install.
    #
    # Sunday 04:00 UTC.
    - cron: "0 4 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and format
    # Not on the weekly schedule: see the cron comment above.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --extra documents so the Phase 2 adapters are linted against the
      # libraries they actually wrap rather than against nothing.
      - run: uv sync --extra dev --extra fixtures --extra documents
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    name: Type check
    # Not on the weekly schedule: see the cron comment above.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --extra documents matters here: without kreuzberg and markitdown
      # installed, mypy sees `Any` for every adapter and checks nothing. It
      # also keeps `warn_unused_ignores` honest — the two `type: ignore`s in
      # the kreuzberg adapter exist because that package's shipped stubs
      # disagree with the package, and mypy can only see that with it present.
      # `--extra gui` for the same reason `--extra documents` is here: without
      # nicegui installed, mypy cannot find it and `src/tokenmill/gui/app.py`
      # fails to check at all. Run 94 failed exactly this way — one job of 25,
      # with the whole test matrix green — because the GUI landed with the
      # extra added to the test job and not to this one.
      - run: uv sync --extra dev --extra fixtures --extra documents --extra gui
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    # Not on the weekly schedule: see the cron comment above.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # Every extra whose tests would otherwise skip. CI exists to exercise
      # more than a developer's laptop, not less: before 2026-08-26 this job
      # installed `documents` only, so the gitingest, readability and chonkie
      # tests silently skipped on all nine cells while passing locally for
      # anyone who happened to have those extras.
      #
      # Everything here is CPU-only and wheel-installable on all three
      # platforms. `docling`, `crawl4ai` and `compress` stay out —
      # multi-gigabyte, and each has its own job or is covered by a stub.
      #
      # `gui` is here for one specific test rather than for the interface: the
      # GUI's own suite deliberately imports no UI toolkit and runs without it.
      # What needs the extra is
      # `test_the_docutils_exemption_is_still_for_the_reason_claimed`, which
      # re-checks the premise of the single entry on the copyleft allow-list
      # against whatever docutils nicegui resolved to. An exemption nobody
      # re-checks is an exemption that outlives its reason.
      - run: >
          uv sync --extra dev --extra fixtures --extra documents
          --extra web --extra repo --extra chunk --extra gui

      # The owner's §3.5. Phase 7's three out-of-process backends had their
      # *conversion* paths exercised on exactly one machine — the development
      # container — because GitHub's runners have neither tool and the AGPL
      # environment is not built there. CI verified only that they report
      # themselves unavailable and skip, which is precisely the condition
      # docs/REVIEW_PHASES_0_6.md complained about for the whole project,
      # narrowed to three backends.
      #
      # Ubuntu only, and that is deliberate rather than laziness. Homebrew and
      # winget would add minutes to the two expensive runners (macOS bills at
      # 10x, Windows at 2x) to re-prove a conversion path that is the same
      # code. What the other cells still prove is the *absent* path, which is
      # what almost every user experiences, and that is worth keeping honest by
      # having runners where these really are missing.
      #
      # libreoffice-writer/-calc/-impress, not `libreoffice`: the metapackage
      # is far larger and this project's own container proved the interesting
      # case, which is that `libreoffice-core` alone puts soffice on PATH and
      # converts nothing.
      - name: Install Pandoc and LibreOffice (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pandoc libreoffice-writer libreoffice-calc libreoffice-impress
          pandoc --version | head -1
          soffice --version

      # Installing an AGPL package in CI, on purpose. The licence rule is about
      # what *tokenmill* imports, and a separate interpreter is exactly the
      # boundary the rule asks for — the same boundary the adapter enforces at
      # runtime. `tests/unit/test_license_isolation.py`'s environment check
      # audits *our* environment, which this is not, so it is unaffected by
      # construction rather than by an exemption.
      #
      # ~/.local/share/tokenmill/pymupdf4llm is the conventional location the
      # adapter's own install hint names, so this step is literally the command
      # the tool prints to a user.
      - name: Build the AGPL environment for pymupdf4llm (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv ~/.local/share/tokenmill/pymupdf4llm
          ~/.local/share/tokenmill/pymupdf4llm/bin/pip install --quiet pymupdf4llm
          ~/.local/share/tokenmill/pymupdf4llm/bin/python -c \
            "import importlib.metadata as m; print('pymupdf4llm', m.version('pymupdf4llm'))"

      - name: Confirm the three runtimes are visible to tokenmill
        if: matrix.os == 'ubuntu-latest'
        run: uv run tokenmill backends --all

      # And the check that matters most about the step above: an AGPL package
      # now exists on this runner, and it must still be impossible for
      # tokenmill to import it. The suite would catch this anyway; running it
      # by name means a failure says *what* broke rather than only that
      # something did.
      - name: The licence boundary, with the AGPL package actually installed
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest -q tests/unit/test_license_isolation.py -rs

      - name: Run tests
        run: uv run pytest -q --cov=tokenmill --cov-report=term-missing -rs

  coverage:
    name: Coverage gate (core and tokens)
    # Not on the weekly schedule: see the cron comment above.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Same extras as the test matrix: a coverage number measured over a
      # different set of installed backends is not the suite's coverage.
      - run: >
          uv sync --extra dev --extra fixtures --extra documents
          --extra web --extra repo --extra chunk --extra gui
      # And the same runtimes, for the same reason. Trap 7 in the Phase 9
      # handover is exactly this mistake made once already: Phase 8 added the
      # `gui` extra to the test and coverage jobs and not to the types job, and
      # CI failed one job of 25 with the whole matrix green. A coverage figure
      # measured with pandoc and libreoffice absent covers different lines of
      # `core` than the test job executes.
      - name: Install Pandoc and LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pandoc libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Build the AGPL environment for pymupdf4llm
        run: |
          python3 -m venv ~/.local/share/tokenmill/pymupdf4llm
          ~/.local/share/tokenmill/pymupdf4llm/bin/pip install --quiet pymupdf4llm
      # DEVELOPMENT_PLAN.md §4 sets a >=85% target on core and tokens
      # specifically; adapters elsewhere are thin wrappers and are allowed to be
      # lower. Gating the two packages the target names stops the number
      # drifting down quietly, which a reported-but-unenforced figure does not.
      - name: Enforce the coverage target on core and tokens
        run: >
          uv run pytest -q
          --cov=tokenmill.core --cov=tokenmill.tokens
          --cov-report=term-missing --cov-fail-under=85

  tokenizers:
    name: Real tokenizers (network)
    # Not on the weekly schedule: see the cron comment above.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra fixtures --extra tokenizers
      # These tests download a real BPE vocabulary from
      # openaipublic.blob.core.windows.net and a tokenizer from huggingface.co.
      # Both hosts are blocked in the development sandbox, so this job is the
      # ONLY place token counting is verified against a real tokenizer — which
      # is exactly why it must be a blocking job and not an advisory one. If it
      # is ever made non-blocking, the project has no verification of its
      # central feature.
      - name: Run the network-marked tests
        run: uv run pytest -q -m network -rs

  fixtures:
    name: Fixture corpus is reproducible
    # Not on the weekly schedule: see the cron comment above.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra fixtures
      # Regenerates the whole corpus into a temp dir and compares SHA-256
      # digests against what is committed. Catches both accidental fixture
      # edits and any non-determinism creeping into the generator.
      - run: uv run python scripts/make_fixtures.py --check

  docling:
    name: Docling (weekly and on demand)
    # Docling resolves to 122 packages and about 5.2 GB, and its PDF path then
    # downloads layout models from huggingface.co on first use. That is far too
    # much to put on every push, and it cannot be covered by a `network`-marked
    # test "without a multi-gigabyte download" either.
    #
    # So it runs weekly and on demand, never on a push. The schedule is the part
    # that matters: it re-verifies a backend whose upstream moves fast, rather
    # than only closing today's gap. Note that `schedule` fires on the default
    # branch only, so a change on a feature branch still needs a manual dispatch
    # against that branch to be covered by it.
    #
    # The development sandbox cannot run this at all: its egress proxy denies
    # huggingface.co. PROGRESS.md records what the last run showed.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      # uv.lock pins the default (CUDA) torch build, which is several
      # gigabytes of wheels a CPU-only job never touches and more than a runner
      # comfortably holds alongside the model cache. So this one job resolves
      # afresh against the CPU torch index instead of the lockfile. Every other
      # job stays frozen; this is the only place a re-resolution is worth the
      # loss of reproducibility, and it is manual-dispatch only.
      - name: Install with the docling extra, CPU-only torch
        env:
          UV_FROZEN: "0"
          UV_TORCH_BACKEND: cpu
        run: uv sync --extra dev --extra fixtures --extra documents --extra docling
      - name: Office formats (no model download needed)
        run: uv run pytest -q tests/integration/test_document_backends.py -k Docling -rs
      - name: PDF path (downloads layout models from huggingface.co)
        run: uv run pytest -q -m heavy -rs

  compress:
    name: Compression (weekly and on demand)
    # Phase 6's success path has never been executed anywhere. The LLMLingua-2
    # model lives on huggingface.co, which the development sandbox denies at
    # its egress proxy, so no compression ratio has ever been produced by this
    # code. That is the largest verification hole in the repository and this
    # job is what closes it.
    #
    # DOES IT FIT? Yes, and on evidence rather than estimate. The `compress`
    # extra resolves to 63 packages and about 4.7 GB, including torch. The
    # docling job beside it installs 122 packages and about 5.2 GB — *more* —
    # with torch 2.13.0, torchvision and triton, and it passed in run 81 in 85
    # seconds, models downloaded and all. A smaller install on the same runner
    # with the same free-disk-space step is not a gamble.
    #
    # Same gating as docling: weekly and on demand, never on a push. `schedule`
    # fires on the default branch only, so a change on a feature branch needs a
    # manual dispatch against that branch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      # Same re-resolution as the docling job, for the same reason: uv.lock
      # pins the default CUDA torch build, which is several gigabytes of wheels
      # a CPU-only job never touches. This is the second and last place a
      # re-resolution is worth the loss of reproducibility.
      #
      # It also answers a question pyproject.toml records as UNVERIFIED: whether
      # the CPU wheel index avoids the seventeen nvidia-* CUDA packages. The
      # development sandbox could not test it — download.pytorch.org is denied
      # there — so the install log of this job is the answer.
      - name: Install with the compress extra, CPU-only torch
        env:
          UV_FROZEN: "0"
          UV_TORCH_BACKEND: cpu
        run: uv sync --extra dev --extra fixtures --extra compress
      - name: Report what the compress extra actually pulled in
        run: |
          uv pip list | wc -l
          uv pip list | grep -i nvidia || echo "no nvidia-* packages: the CPU index worked"
          df -h /
      # The refusal, error and arithmetic paths already run on every cell. This
      # is the one that needs the model, and it is the whole point of the job.
      - name: The success path (downloads the LLMLingua-2 model)
        run: uv run pytest -q -m compress -rs

  clean-core-install:
    name: Clean core install (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Deliberately plain pip, no extras, no dev group: this job is the
      # standing guard on the promise that `pip install tokenmill` stays light,
      # CPU-only and free of system-binary requirements. If a heavy dependency
      # ever leaks into the core tier, this is where it surfaces.
      - name: Install only the core tier
        run: python -m pip install .
      - name: Import the package outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -c "import tokenmill, sys; print(tokenmill.__version__, sys.version)"
      - name: Report what the core install actually pulled in
        run: python -m pip list
      # Defect D4, open since Phase 3 and undecided for four phases: core grew
      # 2.3x when trafilatura arrived and nobody signed the number off. A
      # reported-but-unenforced figure drifts, so it is a gate.
      #
      # 250 MB against 140.6 MB measured on 2026-08-26 by this same script
      # (40 packages, excluding the pip and setuptools scaffolding a venv ships
      # regardless; `du` reports 177 MB for the whole venv because it counts
      # allocated blocks and includes that scaffolding). The
      # headroom is deliberate: an upstream release adding a few megabytes must
      # not turn CI red, while anything torch-shaped — torch alone is over
      # 800 MB — trips it immediately. docs/BENCHMARKS.md carries the
      # composition and the reasoning.
      - name: Enforce the core install weight ceiling
        shell: python {0}
        run: |
          import pathlib, sysconfig
          site = pathlib.Path(sysconfig.get_paths()["purelib"])
          skip = {"pip", "setuptools", "wheel", "pkg_resources", "_distutils_hack"}
          total = 0
          for entry in site.iterdir():
              if entry.name.split("-")[0].split(".")[0] in skip:
                  continue
              if entry.is_file():
                  total += entry.stat().st_size
              else:
                  total += sum(f.stat().st_size for f in entry.rglob("*") if f.is_file())
          mb = total / 1_000_000
          ceiling = 250
          print(f"core install: {mb:.1f} MB of site-packages (ceiling {ceiling} MB)")
          if mb > ceiling:
              raise SystemExit(
                  f"core is {mb:.1f} MB, over the {ceiling} MB ceiling. "
                  "The core install stays light, CPU-only and conflict-free "
                  "(CONTRIBUTING.md rule 1): put the new dependency behind an "
                  "extra, or raise the ceiling deliberately and say why."
              )
