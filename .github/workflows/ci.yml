name: CI

on:
  push:
    # Phase 1 found this workflow had never run once: the filter named `main`,
    # which did not exist, and every phase lived on a `claude/**` branch.
    #
    # Phase 2 found the second half of the same bug. The default branch is now
    # `Main`, with a capital M, and GitHub matches these patterns
    # case-sensitively — so a push to the default branch still would not have
    # triggered anything. Both spellings are listed until the branch is renamed;
    # see PROGRESS.md, Open questions.
    branches: ["main", "Main", "claude/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. Primarily for the `docling` job below, which is gated to this
    # trigger and to manual dispatch. RESEARCH.md's own
    # closing caveat is that this ecosystem moves fast and versions and licences
    # must be re-verified before shipping; docs/BACKENDS.md's premise is that
    # every claim about a backend is asserted by a test. A backend nobody ever
    # exercises is a claim quietly decaying, and docling — 122 packages deep — is
    # the likeliest to drift.
    #
    # The rest of the matrix runs too, and that is wanted rather than tolerated:
    # `clean-core-install` uses plain `pip install .` with no lockfile, so a
    # weekly run is the one thing that catches a new release of a core
    # dependency breaking a fresh install. Sunday 04:00 UTC.
    - cron: "0 4 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --extra documents so the Phase 2 adapters are linted against the
      # libraries they actually wrap rather than against nothing.
      - run: uv sync --extra dev --extra fixtures --extra documents
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --extra documents matters here: without kreuzberg and markitdown
      # installed, mypy sees `Any` for every adapter and checks nothing. It
      # also keeps `warn_unused_ignores` honest — the two `type: ignore`s in
      # the kreuzberg adapter exist because that package's shipped stubs
      # disagree with the package, and mypy can only see that with it present.
      - run: uv sync --extra dev --extra fixtures --extra documents
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # --extra documents so the markitdown and kreuzberg integration tests
      # run rather than skipping. Everything it pulls is CPU-only, permissively
      # licensed and wheel-installable on all three platforms; docling stays
      # out, which is the whole point of its separate extra.
      - run: uv sync --extra dev --extra fixtures --extra documents
      - name: Run tests
        run: uv run pytest -q --cov=tokenmill --cov-report=term-missing -rs

  coverage:
    name: Coverage gate (core and tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra fixtures --extra documents
      # DEVELOPMENT_PLAN.md §4 sets a >=85% target on core and tokens
      # specifically; adapters elsewhere are thin wrappers and are allowed to be
      # lower. Gating the two packages the target names stops the number
      # drifting down quietly, which a reported-but-unenforced figure does not.
      - name: Enforce the coverage target on core and tokens
        run: >
          uv run pytest -q
          --cov=tokenmill.core --cov=tokenmill.tokens
          --cov-report=term-missing --cov-fail-under=85

  tokenizers:
    name: Real tokenizers (network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra fixtures --extra tokenizers
      # These tests download a real BPE vocabulary from
      # openaipublic.blob.core.windows.net and a tokenizer from huggingface.co.
      # Both hosts are blocked in the development sandbox, so this job is the
      # ONLY place token counting is verified against a real tokenizer — which
      # is exactly why it must be a blocking job and not an advisory one. If it
      # is ever made non-blocking, the project has no verification of its
      # central feature.
      - name: Run the network-marked tests
        run: uv run pytest -q -m network -rs

  fixtures:
    name: Fixture corpus is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra fixtures
      # Regenerates the whole corpus into a temp dir and compares SHA-256
      # digests against what is committed. Catches both accidental fixture
      # edits and any non-determinism creeping into the generator.
      - run: uv run python scripts/make_fixtures.py --check

  docling:
    name: Docling (weekly and on demand)
    # Docling resolves to 122 packages and about 5.2 GB, and its PDF path then
    # downloads layout models from huggingface.co on first use. That is far too
    # much to put on every push, and it cannot be covered by a `network`-marked
    # test "without a multi-gigabyte download" either.
    #
    # So it runs weekly and on demand, never on a push. The schedule is the part
    # that matters: it re-verifies a backend whose upstream moves fast, rather
    # than only closing today's gap. Note that `schedule` fires on the default
    # branch only, so a change on a feature branch still needs a manual dispatch
    # against that branch to be covered by it.
    #
    # The development sandbox cannot run this at all: its egress proxy denies
    # huggingface.co. PROGRESS.md records what the last run showed.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      # uv.lock pins the default (CUDA) torch build, which is several
      # gigabytes of wheels a CPU-only job never touches and more than a runner
      # comfortably holds alongside the model cache. So this one job resolves
      # afresh against the CPU torch index instead of the lockfile. Every other
      # job stays frozen; this is the only place a re-resolution is worth the
      # loss of reproducibility, and it is manual-dispatch only.
      - name: Install with the docling extra, CPU-only torch
        env:
          UV_FROZEN: "0"
          UV_TORCH_BACKEND: cpu
        run: uv sync --extra dev --extra fixtures --extra documents --extra docling
      - name: Office formats (no model download needed)
        run: uv run pytest -q tests/integration/test_document_backends.py -k Docling -rs
      - name: PDF path (downloads layout models from huggingface.co)
        run: uv run pytest -q -m heavy -rs

  clean-core-install:
    name: Clean core install (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Deliberately plain pip, no extras, no dev group: this job is the
      # standing guard on the promise that `pip install tokenmill` stays light,
      # CPU-only and free of system-binary requirements. If a heavy dependency
      # ever leaks into the core tier, this is where it surfaces.
      - name: Install only the core tier
        run: python -m pip install .
      - name: Import the package outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -c "import tokenmill, sys; print(tokenmill.__version__, sys.version)"
      - name: Report what the core install actually pulled in
        run: python -m pip list
